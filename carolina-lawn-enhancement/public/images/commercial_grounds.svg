<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="commSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="officeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="asphalt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="260" fill="url(#commSky)" />
  <circle cx="120" cy="70" r="40" fill="#fef08a" opacity="0.9" />

  <!-- Commercial Office Campus Architecture in Charlotte -->
  <rect x="240" y="80" width="320" height="240" rx="4" fill="url(#officeGlass)" stroke="#1e293b" stroke-width="3" />
  
  <!-- Glass Window Grid Lines -->
  <g stroke="#93c5fd" stroke-width="1.5" opacity="0.6">
    <line x1="240" y1="120" x2="560" y2="120" />
    <line x1="240" y1="160" x2="560" y2="160" />
    <line x1="240" y1="200" x2="560" y2="200" />
    <line x1="240" y1="240" x2="560" y2="240" />
    <line x1="240" y1="280" x2="560" y2="280" />
    <line x1="300" y1="80" x2="300" y2="320" />
    <line x1="360" y1="80" x2="360" y2="320" />
    <line x1="420" y1="80" x2="420" y2="320" />
    <line x1="480" y1="80" x2="480" y2="320" />
  </g>

  <!-- Side Building Wings -->
  <rect x="80" y="140" width="160" height="180" fill="#475569" />
  <rect x="560" y="140" width="160" height="180" fill="#475569" />

  <!-- Manicured Commercial Turf Lawn & Medians -->
  <polygon points="0,320 800,320 800,600 0,600" fill="#15803d" />

  <!-- Diamond Striping on Commercial Lawn -->
  <g opacity="0.5">
    <polygon points="-50,600 120,320 180,320 10,600" fill="#4ade80" />
    <polygon points="70,600 240,320 300,320 130,600" fill="#4ade80" />
    <polygon points="190,600 360,320 420,320 250,600" fill="#4ade80" />
    <polygon points="310,600 480,320 540,320 370,600" fill="#4ade80" />
    <polygon points="430,600 600,320 660,320 490,600" fill="#4ade80" />
    <polygon points="550,600 720,320 780,320 610,600" fill="#4ade80" />
  </g>

  <!-- Curving Clean Parking Lot Entrance Driveway -->
  <path d="M 0,540 Q 400,480 800,560 L 800,600 L 0,600 Z" fill="url(#asphalt)" />
  <line x1="0" y1="540" x2="800" y2="560" stroke="#f1f5f9" stroke-width="4" />

  <!-- Manicured Circular Island Bed in Foreground -->
  <ellipse cx="400" cy="420" rx="140" ry="50" fill="#291810" stroke="#f8fafc" stroke-width="4" />
  
  <!-- Architectural Conical Evergreens in Median -->
  <polygon points="340,430 360,350 380,430" fill="#166534" />
  <polygon points="400,430 420,340 440,430" fill="#15803d" />
  <polygon points="460,430 480,350 500,430" fill="#166534" />

  <!-- Badge Overlay -->
  <g transform="translate(30, 480)">
    <rect width="300" height="75" rx="12" fill="#0c2317" fill-opacity="0.92" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="36" cy="37" r="18" fill="#fbbf24" />
    <path d="M 28,45 L 28,30 L 44,30 L 44,45" stroke="#0c2317" stroke-width="2.5" fill="none" />
    <text x="65" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Commercial &amp; HOA Grounds</text>
    <text x="65" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#cbd5e1">Year-round agreements · QuickBooks auto-billing</text>
  </g>
</svg>
