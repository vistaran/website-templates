<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="overcastSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="patchyLawn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#847347" />
      <stop offset="40%" stop-color="#65723b" />
      <stop offset="70%" stop-color="#a37848" />
      <stop offset="100%" stop-color="#736035" />
    </linearGradient>
    <radialGradient id="redClayPatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="70%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#847347" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Overcast Sky -->
  <rect width="800" height="230" fill="url(#overcastSky)" />

  <!-- Background Overgrown Untrimmed Trees -->
  <path d="M 0,210 Q 150,170 300,195 Q 450,165 600,190 Q 720,170 800,205 L 800,230 L 0,230 Z" fill="#3f4a3c" opacity="0.9" />

  <!-- House Silhouette in Background -->
  <rect x="220" y="140" width="360" height="120" fill="#78350f" opacity="0.75" />
  <polygon points="400,90 200,150 600,150" fill="#475569" />
  <rect x="260" y="170" width="40" height="50" fill="#cbd5e1" />
  <rect x="500" y="170" width="40" height="50" fill="#cbd5e1" />
  <rect x="375" y="180" width="50" height="80" fill="#94a3b8" />

  <!-- Neglected, Thin, Patchy Grass Base -->
  <polygon points="0,230 800,230 800,600 0,600" fill="url(#patchyLawn)" />

  <!-- Bare Carolina Red Clay Compaction Spots -->
  <ellipse cx="260" cy="360" rx="90" ry="45" fill="url(#redClayPatch)" />
  <ellipse cx="440" cy="480" rx="140" ry="60" fill="url(#redClayPatch)" />
  <ellipse cx="140" cy="490" rx="110" ry="50" fill="url(#redClayPatch)" />
  <ellipse cx="620" cy="380" rx="80" ry="40" fill="url(#redClayPatch)" />

  <!-- Weed Clumps (Yellow Dandelions & Broadleaf Crabgrass) -->
  <!-- Dandelion Patch 1 -->
  <g transform="translate(320, 310)">
    <circle cx="0" cy="0" r="7" fill="#facc15" />
    <circle cx="15" cy="8" r="6" fill="#facc15" />
    <circle cx="-12" cy="10" r="5" fill="#facc15" />
    <path d="M -5,12 L 0,0 L 8,15" stroke="#4d7c0f" stroke-width="2" />
  </g>

  <!-- Dandelion Patch 2 -->
  <g transform="translate(520, 420)">
    <circle cx="0" cy="0" r="8" fill="#facc15" />
    <circle cx="18" cy="-5" r="7" fill="#facc15" />
    <circle cx="10" cy="12" r="6" fill="#facc15" />
    <circle cx="-14" cy="5" r="7" fill="#facc15" />
  </g>

  <!-- Dandelion Patch 3 -->
  <g transform="translate(180, 420)">
    <circle cx="0" cy="0" r="7" fill="#facc15" />
    <circle cx="12" cy="6" r="6" fill="#facc15" />
    <circle cx="-10" cy="8" r="5" fill="#facc15" />
  </g>

  <!-- Uncut Spindly Weeds Growing High -->
  <g stroke="#65a30d" stroke-width="2.5" stroke-linecap="round">
    <line x1="380" y1="360" x2="375" y2="310" />
    <line x1="385" y1="360" x2="390" y2="305" />
    <line x1="490" y1="380" x2="485" y2="330" />
    <line x1="495" y1="380" x2="505" y2="335" />
    <line x1="280" y1="460" x2="275" y2="400" />
    <line x1="680" y1="460" x2="685" y2="390" />
  </g>

  <!-- Untrimmed Faded Overgrown Bush on Right -->
  <path d="M 600,600 C 580,480 620,400 700,360 C 780,320 800,450 800,600 Z" fill="#365314" opacity="0.85" />
  <circle cx="680" cy="440" r="60" fill="#4d7c0f" opacity="0.6" />
  <circle cx="740" cy="480" r="70" fill="#365314" />
  
  <!-- Dead Thatch / Bare Edging with No Trench Definition -->
  <path d="M 0,530 Q 300,560 600,530" stroke="#78350f" stroke-width="6" stroke-dasharray="15,10" fill="none" />

  <!-- Stamp Tag -->
  <g transform="translate(30, 30)">
    <rect width="180" height="42" rx="8" fill="#18181b" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="22" cy="21" r="9" fill="#ef4444" />
    <text x="18" y="25" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">!</text>
    <text x="38" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">BEFORE NEGLECT</text>
  </g>
</svg>
