<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="hardwoodMulch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a11" />
      <stop offset="50%" stop-color="#3d2417" />
      <stop offset="100%" stop-color="#1f120c" />
    </linearGradient>
    <linearGradient id="pineStraw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="lawnEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Clean Background Green Lawn -->
  <rect width="800" height="600" fill="url(#lawnEdge)" />

  <!-- Crisp Trench Edged Garden Bed on Left (Dark Hardwood Mulch) -->
  <path d="M 0,0 L 400,0 Q 320,300 420,600 L 0,600 Z" fill="url(#hardwoodMulch)" />
  <!-- Shovel Trench Cut Edge -->
  <path d="M 400,0 Q 320,300 420,600" stroke="#052e16" stroke-width="5" fill="none" />

  <!-- Pine Straw Bed Section on Right -->
  <path d="M 800,0 L 520,0 Q 600,280 500,600 L 800,600 Z" fill="url(#pineStraw)" />
  <!-- Trench Cut Edge -->
  <path d="M 520,0 Q 600,280 500,600" stroke="#052e16" stroke-width="5" fill="none" />

  <!-- Hardwood Mulch Bark Texture Flecks -->
  <g fill="#451a03" opacity="0.6">
    <ellipse cx="120" cy="140" rx="14" ry="6" transform="rotate(25 120 140)" />
    <ellipse cx="220" cy="180" rx="16" ry="7" transform="rotate(-35 220 180)" />
    <ellipse cx="140" cy="280" rx="15" ry="6" transform="rotate(15 140 280)" />
    <ellipse cx="260" cy="340" rx="18" ry="8" transform="rotate(-20 260 340)" />
    <ellipse cx="180" cy="460" rx="14" ry="6" transform="rotate(40 180 460)" />
    <ellipse cx="280" cy="520" rx="16" ry="7" transform="rotate(-15 280 520)" />
  </g>

  <!-- Longleaf Pine Straw Needle Texture Lines -->
  <g stroke="#d97706" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
    <line x1="620" y1="120" x2="680" y2="150" />
    <line x1="640" y1="110" x2="710" y2="135" />
    <line x1="720" y1="200" x2="670" y2="240" />
    <line x1="740" y1="220" x2="660" y2="250" />
    <line x1="590" y1="320" x2="660" y2="350" />
    <line x1="620" y1="360" x2="700" y2="380" />
    <line x1="680" y1="460" x2="740" y2="490" />
    <line x1="600" y1="500" x2="670" y2="520" />
  </g>

  <!-- Featured Plant: Japanese Red Maple in Left Bed -->
  <g transform="translate(180, 260)">
    <path d="M 0,160 Q 20,80 10,0" stroke="#451a03" stroke-width="8" fill="none" stroke-linecap="round" />
    <circle cx="10" cy="-20" r="45" fill="#dc2626" opacity="0.85" />
    <circle cx="-20" cy="10" r="38" fill="#b91c1c" opacity="0.9" />
    <circle cx="35" cy="5" r="35" fill="#991b1b" opacity="0.85" />
  </g>

  <!-- Featured Plant: Golden Euonymus in Right Bed -->
  <g transform="translate(640, 280)">
    <circle cx="0" cy="0" r="42" fill="#15803d" />
    <circle cx="10" cy="-10" r="35" fill="#facc15" opacity="0.7" />
    <circle cx="-10" cy="15" r="30" fill="#eab308" opacity="0.6" />
  </g>

  <!-- Center Emerald Turf Strip -->
  <g transform="translate(420, 200)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#86efac" stroke-width="3" />
    <line x1="10" y1="40" x2="60" y2="40" stroke="#86efac" stroke-width="3" />
    <line x1="-5" y1="80" x2="45" y2="80" stroke="#86efac" stroke-width="3" />
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(30, 490)">
    <rect width="290" height="75" rx="12" fill="#0c2317" fill-opacity="0.92" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="36" cy="37" r="18" fill="#fbbf24" />
    <path d="M 28,37 C 28,30 44,28 44,37 C 44,46 28,44 28,37 Z" fill="#0c2317" />
    <text x="65" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Hardwood Mulch &amp; Pine</text>
    <text x="65" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#cbd5e1">Deep trench edges · 3" thermal barrier</text>
  </g>
</svg>
