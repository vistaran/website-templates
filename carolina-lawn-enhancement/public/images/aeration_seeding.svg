<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyAeration" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="soilCrossSection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="25%" stop-color="#3d2212" />
      <stop offset="60%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="url(#skyAeration)" />
  <polygon points="0,170 800,160 800,260 0,270" fill="#15803d" />

  <!-- Soil Cross Section Showing Deep Core Aeration Holes & Roots -->
  <polygon points="0,260 800,250 800,600 0,600" fill="url(#soilCrossSection)" />

  <!-- Core Aeration Plug Holes Pulled 2.5 inches deep -->
  <g fill="#1e293b" opacity="0.9">
    <rect x="70" y="258" width="14" height="90" rx="7" />
    <rect x="150" y="257" width="14" height="95" rx="7" />
    <rect x="230" y="256" width="14" height="88" rx="7" />
    <rect x="310" y="255" width="14" height="92" rx="7" />
    <rect x="390" y="254" width="14" height="96" rx="7" />
    <rect x="470" y="253" width="14" height="90" rx="7" />
    <rect x="550" y="252" width="14" height="94" rx="7" />
    <rect x="630" y="251" width="14" height="91" rx="7" />
    <rect x="710" y="250" width="14" height="93" rx="7" />
  </g>

  <!-- Deep Fescue Root Systems Penetrating Holes -->
  <g stroke="#fef08a" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 77,258 Q 72,320 85,420 Q 95,470 80,540" />
    <path d="M 157,257 Q 165,330 150,440 Q 140,510 160,560" />
    <path d="M 237,256 Q 230,325 245,430 Q 255,490 235,550" />
    <path d="M 317,255 Q 325,340 310,450 Q 300,510 325,570" />
    <path d="M 397,254 Q 390,335 405,440 Q 415,500 395,565" />
    <path d="M 477,253 Q 485,330 470,435 Q 460,495 480,555" />
    <path d="M 557,252 Q 550,340 565,445 Q 575,510 555,570" />
    <path d="M 637,251 Q 645,335 630,440 Q 620,505 640,560" />
    <path d="M 717,250 Q 710,330 725,435 Q 735,495 715,550" />
  </g>

  <!-- Extracted Soil Plugs Deposited on Surface (Decomposing) -->
  <g fill="#7c2d12" stroke="#451a03" stroke-width="1.5">
    <rect x="95" y="248" width="22" height="10" rx="4" transform="rotate(-15 95 248)" />
    <rect x="175" y="247" width="24" height="11" rx="4" transform="rotate(20 175 247)" />
    <rect x="255" y="246" width="22" height="10" rx="4" transform="rotate(-10 255 246)" />
    <rect x="335" y="245" width="24" height="11" rx="4" transform="rotate(25 335 245)" />
    <rect x="415" y="244" width="22" height="10" rx="4" transform="rotate(-18 415 244)" />
    <rect x="495" y="243" width="24" height="11" rx="4" transform="rotate(15 495 243)" />
    <rect x="575" y="242" width="22" height="10" rx="4" transform="rotate(-12 575 242)" />
    <rect x="655" y="241" width="24" height="11" rx="4" transform="rotate(22 655 241)" />
  </g>

  <!-- Certified Fescue Seeds Dropping Into Holes -->
  <g fill="#fef3c7" stroke="#d97706" stroke-width="1">
    <ellipse cx="77" cy="275" rx="3" ry="5" />
    <ellipse cx="157" cy="285" rx="3" ry="5" />
    <ellipse cx="237" cy="270" rx="3" ry="5" />
    <ellipse cx="317" cy="290" rx="3" ry="5" />
    <ellipse cx="397" cy="280" rx="3" ry="5" />
    <ellipse cx="477" cy="272" rx="3" ry="5" />
    <ellipse cx="557" cy="288" rx="3" ry="5" />
    <ellipse cx="637" cy="276" rx="3" ry="5" />
    <ellipse cx="717" cy="282" rx="3" ry="5" />
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(30, 30)">
    <rect width="280" height="75" rx="12" fill="#0c2317" fill-opacity="0.92" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="36" cy="37" r="18" fill="#fbbf24" />
    <path d="M 36,25 L 36,49 M 28,37 L 44,37" stroke="#0c2317" stroke-width="3" stroke-linecap="round" />
    <text x="65" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Clay Core Aeration</text>
    <text x="65" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#cbd5e1">2.5" Plugs · Blue Tag Fescue Seed</text>
  </g>
</svg>
