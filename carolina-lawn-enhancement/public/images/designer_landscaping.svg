<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="45%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="patioStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1" />
      <stop offset="50%" stop-color="#a8a29e" />
      <stop offset="100%" stop-color="#78716c" />
    </linearGradient>
    <linearGradient id="stackedStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="30%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hydrangeaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lawnEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Twilight Sky Background -->
  <rect width="800" height="240" fill="url(#twilightSky)" />

  <!-- Background Forest Silhouettes -->
  <path d="M 0,200 Q 150,140 300,180 Q 450,130 600,170 Q 720,150 800,190 L 800,240 L 0,240 Z" fill="#0f172a" opacity="0.9" />
  
  <!-- Lush Elevated Background Lawn -->
  <polygon points="0,210 800,180 800,320 0,340" fill="url(#lawnEmerald)" />

  <!-- Curved Stacked-Stone Retaining Wall -->
  <path d="M 0,330 Q 350,290 800,310 L 800,410 Q 350,380 0,420 Z" fill="url(#stackedStone)" stroke="#292524" stroke-width="2" />
  
  <!-- Stacked Stone Horizontal & Vertical Course Lines -->
  <g stroke="#1c1917" stroke-width="1.5" opacity="0.75">
    <path d="M 0,350 Q 350,310 800,330" fill="none" />
    <path d="M 0,370 Q 350,330 800,350" fill="none" />
    <path d="M 0,390 Q 350,350 800,370" fill="none" />
    <path d="M 0,410 Q 350,370 800,390" fill="none" />
    
    <!-- Vertical stone joints -->
    <line x1="60" y1="330" x2="60" y2="350" />
    <line x1="140" y1="350" x2="140" y2="370" />
    <line x1="220" y1="330" x2="220" y2="350" />
    <line x1="310" y1="350" x2="310" y2="370" />
    <line x1="410" y1="330" x2="410" y2="350" />
    <line x1="500" y1="350" x2="500" y2="370" />
    <line x1="620" y1="330" x2="620" y2="350" />
    <line x1="720" y1="350" x2="720" y2="370" />
  </g>

  <!-- Dark Rich Mulch Garden Bed Above Patio -->
  <path d="M 0,380 Q 400,350 800,370 L 800,440 Q 400,420 0,440 Z" fill="#261a14" />

  <!-- Plantings in Tiered Bed: Boxwoods & Carolina Hydrangeas -->
  <!-- Hydrangeas Cluster 1 -->
  <g transform="translate(100, 310)">
    <circle cx="20" cy="20" r="26" fill="url(#hydrangeaBlue)" />
    <circle cx="38" cy="12" r="22" fill="#60a5fa" />
    <circle cx="8" cy="30" r="20" fill="#3b82f6" />
    <circle cx="32" cy="35" r="24" fill="#93c5fd" />
    <path d="M -10,35 Q 20,50 30,70" stroke="#166534" stroke-width="4" fill="none" />
  </g>

  <!-- Ornamental Evergreen Shrub -->
  <g transform="translate(260, 310)">
    <circle cx="30" cy="30" r="34" fill="#15803d" />
    <circle cx="25" cy="25" r="28" fill="#22c55e" opacity="0.6" />
  </g>

  <!-- Hydrangeas Cluster 2 -->
  <g transform="translate(420, 310)">
    <circle cx="22" cy="18" r="28" fill="#e879f9" />
    <circle cx="40" cy="12" r="24" fill="#c084fc" />
    <circle cx="10" cy="32" r="22" fill="#d946ef" />
    <circle cx="35" cy="34" r="26" fill="#f0abfc" />
  </g>

  <!-- Tiered Shrub 3 -->
  <g transform="translate(590, 300)">
    <circle cx="35" cy="35" r="38" fill="#14532d" />
    <circle cx="28" cy="28" r="30" fill="#16a34a" opacity="0.6" />
  </g>

  <!-- Lower Natural Stone Paver Patio Surface -->
  <polygon points="0,420 800,390 800,600 0,600" fill="url(#patioStone)" />
  
  <!-- Flagstone Paver Joint Grid -->
  <g stroke="#57534e" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M 0,480 Q 200,470 400,490 T 800,470" />
    <path d="M 0,540 Q 300,530 600,550 T 800,530" />
    <path d="M 120,420 L 140,480 L 100,540 L 130,600" />
    <path d="M 280,410 L 260,485 L 290,540 L 270,600" />
    <path d="M 450,405 L 430,490 L 470,545 L 440,600" />
    <path d="M 620,400 L 640,480 L 610,540 L 630,600" />
    <path d="M 740,395 L 760,475 L 730,535 L 750,600" />
  </g>

  <!-- Low Voltage Ambient Landscape Light Fixtures -->
  <!-- Light Fixture 1 -->
  <g transform="translate(200, 420)">
    <circle cx="0" cy="0" r="60" fill="url(#lightGlow)" />
    <rect x="-3" y="-18" width="6" height="24" fill="#0f172a" rx="2" />
    <polygon points="-8,-18 8,-18 0,-24" fill="#0f172a" />
    <circle cx="0" cy="-14" r="3" fill="#fef08a" />
  </g>

  <!-- Light Fixture 2 -->
  <g transform="translate(540, 410)">
    <circle cx="0" cy="0" r="60" fill="url(#lightGlow)" />
    <rect x="-3" y="-18" width="6" height="24" fill="#0f172a" rx="2" />
    <polygon points="-8,-18 8,-18 0,-24" fill="#0f172a" />
    <circle cx="0" cy="-14" r="3" fill="#fef08a" />
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(30, 490)">
    <rect width="290" height="75" rx="12" fill="#0c2317" fill-opacity="0.92" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="36" cy="37" r="18" fill="#fbbf24" />
    <polygon points="36,26 43,44 26,33 46,33 29,44" fill="#0c2317" />
    <text x="65" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Designer Stone &amp; Flora</text>
    <text x="65" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#cbd5e1">Custom patios, retaining walls &amp; beds</text>
  </g>
</svg>
