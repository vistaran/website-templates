<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="belmontSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="zoysiaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <rect width="800" height="220" fill="url(#belmontSky)" />
  <circle cx="680" cy="70" r="50" fill="#fef08a" opacity="0.9" />

  <polygon points="0,200 800,180 800,600 0,600" fill="url(#zoysiaGreen)" />

  <!-- Crisp Diamond Lawn Stripes -->
  <g opacity="0.6">
    <polygon points="-50,600 120,200 190,200 20,600" fill="#4ade80" />
    <polygon points="60,600 230,200 300,200 130,600" fill="#4ade80" />
    <polygon points="170,600 340,200 410,200 240,600" fill="#4ade80" />
    <polygon points="280,600 450,200 520,200 350,600" fill="#4ade80" />
    <polygon points="390,600 560,200 630,200 460,600" fill="#4ade80" />
    <polygon points="500,600 670,200 740,200 570,600" fill="#4ade80" />
    <polygon points="610,600 780,200 850,200 680,600" fill="#4ade80" />
  </g>

  <!-- Opposite Diagonal Cross Lines for Diamond Pattern -->
  <g opacity="0.25">
    <polygon points="850,600 680,200 610,200 780,600" fill="#86efac" />
    <polygon points="670,600 500,200 430,200 600,600" fill="#86efac" />
    <polygon points="490,600 320,200 250,200 420,600" fill="#86efac" />
    <polygon points="310,600 140,200 70,200 240,600" fill="#86efac" />
  </g>

  <!-- Clean Concrete Edge Border & Curb -->
  <polygon points="0,540 800,500 800,600 0,600" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <line x1="0" y1="538" x2="800" y2="498" stroke="#052e16" stroke-width="4" />

  <!-- Stamp Tag -->
  <g transform="translate(30, 30)">
    <rect width="210" height="42" rx="8" fill="#0c2317" fill-opacity="0.9" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="22" cy="21" r="9" fill="#22c55e" />
    <path d="M 17,21 L 20,24 L 27,17" stroke="#0c2317" stroke-width="2" fill="none" />
    <text x="38" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">AFTER ENHANCEMENT</text>
  </g>
</svg>
